  <style>
    :root {
      --terracotta: #D77C67;
      --warm-beige: #FBF8F6;
      --dark-brown: #5B463D;
      --soft-white: rgba(255, 255, 255, 0.95);
      --glass-bg: rgba(255, 255, 255, 0.88);
    }
    
    /* Floral background */
    body {
      background: url('images/assets/background.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: var(--dark-brown);
    }
    
    /* Position floral decorations to frame the card */
    .floral-decoration {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    
    .floral-top-left {
      top: 10%;
      left: 5%;
      width: 250px;
      height: 300px;
      background: url('images/assets/party-left.png') no-repeat center;
      background-size: contain;
      animation: fadeIn 0.8s ease 0.2s forwards;
    }
    
    .floral-top-right {
      top: 8%;
      right: 3%;
      width: 220px;
      height: 280px;
      background: url('images/assets/party-right.png') no-repeat center;
      background-size: contain;
      animation: fadeIn 0.8s ease 0.3s forwards;
    }
    
    .floral-bottom-left {
      bottom: 15%;
      left: 8%;
      width: 200px;
      height: 250px;
      background: url('images/assets/party-left.png') no-repeat center;
      background-size: contain;
      opacity: 0.7;
      animation: fadeIn 0.8s ease 0.5s forwards;
    }
    
    .floral-bottom-right {
      bottom: 12%;
      right: 5%;
      width: 240px;
      height: 220px;
      background: url('images/assets/party-right.png') no-repeat center;
      background-size: contain;
      opacity: 0.7;
      animation: fadeIn 0.8s ease 0.6s forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Mobile image overrides */
    @media (max-width: 768px) {
      body {
        background: url('images/assets/background_mobile.png') no-repeat center center fixed !important;
        background-size: cover !important;
      }
      .floral-top-left {
        background: url('images/assets/party-left_mobile.png') no-repeat center !important;
        background-size: contain !important;
      }
      .floral-top-right {
        background: url('images/assets/party-right_mobile.png') no-repeat center !important;
        background-size: contain !important;
      }
      .floral-bottom-left {
        background: url('images/assets/party-left_mobile.png') no-repeat center !important;
        background-size: contain !important;
      }
      .floral-bottom-right {
        background: url('images/assets/party-right_mobile.png') no-repeat center !important;
        background-size: contain !important;
      }
    }
    
    /* Premium card */
    .language-selector-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }
    
    .language-selector {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(215, 124, 103, 0.15);
      max-width: 580px;
      width: 90%;
      border: 1px solid rgba(215, 124, 103, 0.2);
      animation: slideUp 0.8s ease 0.3s forwards;
    }
    
    /* Typography */
    .language-selector h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 600;
      color: var(--terracotta);
      margin: 0 0 0.5rem;
      letter-spacing: 1px;
    }
    
    .language-selector .date {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--terracotta);
      margin: 0 0 2rem;
      letter-spacing: 3px;
      font-weight: 400;
    }
    
    .language-selector .welcome {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      color: var(--dark-brown);
      margin: 0 0 0.25rem;
      font-weight: 400;
      line-height: 1.5;
    }
    
    .language-selector .welcome-vi {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      color: var(--dark-brown);
      margin: 0 0 2.5rem;
      font-weight: 400;
      opacity: 0.9;
    }
    
    /* Full-width language buttons */
    .lang-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }
    
    .lang-button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--dark-brown);
      transition: all 0.3s ease;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      background: var(--soft-white);
      border: 1px solid rgba(215, 124, 103, 0.15);
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 500;
      opacity: 0;
    }
    
    .lang-button:nth-child(1) {
      animation: fadeInUp 0.6s ease 0.7s forwards;
    }
    
    .lang-button:nth-child(2) {
      animation: fadeInUp 0.6s ease 0.85s forwards;
    }
    
    .lang-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(215, 124, 103, 0.25);
      background: white;
      border-color: rgba(215, 124, 103, 0.3);
    }
    
    .lang-button .flag {
      font-size: 1.5rem;
    }
    
    .lang-button .label {
      flex: 1;
      text-align: left;
      letter-spacing: 0.5px;
    }
    
    /* Personal touch */
    .personal-touch {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(215, 124, 103, 0.15);
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.85rem, 1.9vw, 0.95rem);
      color: var(--dark-brown);
      opacity: 0.85;
      font-style: italic;
      animation: fadeInUp 0.6s ease 1s forwards;
      opacity: 0;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .language-selector {
        padding: 2.5rem 2rem;
        max-width: 520px;
      }
      
      .language-selector h1 {
        font-size: 2.2rem;
      }
      
      .floral-top-left {
        top: 8%;
        left: 3%;
        width: 180px;
      }
      
      .floral-top-right {
        top: 6%;
        right: 2%;
        width: 160px;
      }
      
      .floral-bottom-left {
        bottom: 12%;
        left: 5%;
        width: 150px;
      }
      
      .floral-bottom-right {
        bottom: 10%;
        right: 3%;
        width: 180px;
      }
    }
    
    @media (max-width: 480px) {
      .language-selector {
        padding: 2rem 1.5rem;
        border-radius: 20px;
        width: 94%;
      }
      
      .language-selector h1 {
        font-size: 1.8rem;
      }
      
      .language-selector .date {
        font-size: 1rem;
        letter-spacing: 2px;
      }
      
      .floral-top-left,
      .floral-top-right,
      .floral-bottom-left,
      .floral-bottom-right {
        display: none;
      }
      
      .lang-button {
        padding: 1rem;
      }
    }
    
    /* Hide carousel navigation and dots from main.css */
    .carousel-nav, .carousel-dots {
      display: none !important;
    }
  </style>
</head>

  <div class="floral-decoration floral-bottom-left"></div>
  <div class="floral-decoration floral-bottom-right"></div>
  
  <div class="language-selector-container">
    <div class="language-selector">
      <h1>ROY & LAN</h1>
      <p class="date">12 . 12 . 2026</p>
      
      <p class="welcome">Welcome to our wedding website</p>
      <p class="welcome-vi">Chào mừng đến với trang web đám cưới của chúng tôi</p>
      
      <div class="lang-buttons">
        <a href="en/" class="lang-button">
          <span class="flag">🇬🇧</span>
          <span class="label">English</span>
        </a>
        <a href="vn/" class="lang-button">
          <span class="flag">🇻🇳</span>
          <span class="label">Tiếng Việt</span>
        </a>
      </div>
      
      <p class="personal-touch">We can't wait to celebrate with you.</p>
    </div>
  </div>

  <div id="confetti"></div>
  <script type="text/javascript" src="js/confetti.js"></script>
